version: '3.8'

services:
  telemetry:
    build: .
    container_name: zero-pii-telemetry
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - TELEMETRY_DATA_DIR=/var/lib/telemetry
      - TELEMETRY_ALLOWED_HOSTS=localhost,127.0.0.1,example.com
      - TELEMETRY_SERVICES=app,web,api
      - TELEMETRY_ADMIN_USER=${TELEMETRY_ADMIN_USER:-admin}
      - TELEMETRY_ADMIN_PASSWORD_HASH=${TELEMETRY_ADMIN_PASSWORD_HASH:-}
      - PORTAL_MANAGEMENT_ORIGIN=${TELEMETRY_MANAGEMENT_ORIGIN:-http://localhost:8080}
      # Optional: Slack / Discord alert webhook URL
      # - CSP_WEBHOOK_URL=https://hooks.slack.com/services/xxx/yyy/zzz
    volumes:
      - telemetry-data:/var/lib/telemetry

volumes:
  telemetry-data:
