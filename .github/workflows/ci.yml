name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php-version }} on Ubuntu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_sqlite, curl

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Telemetry Regression Tests (with coverage)
        if: matrix.php-version == '8.3'
        run: |
          pip install coverage unittest-xml-reporting
          coverage run -m xmlrunner src/tests/telemetry_test.py -o coverage
          coverage xml -o coverage.xml

      - name: Run Telemetry Regression Tests
        if: matrix.php-version != '8.3'
        run: python src/tests/telemetry_test.py

      - name: Upload coverage reports to Codecov
        if: matrix.php-version == '8.3'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload test results to Codecov (Test Analytics)
        if: ${{ !cancelled() && matrix.php-version == '8.3' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report-type: test_results
          files: ./coverage/TEST-*.xml
          fail_ci_if_error: false

  docker-build:
    name: Validate Docker Container Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t zero-pii-telemetry:test .
